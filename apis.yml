apis:
  - aid: takepayments:takepayments-terminal-api
    name: takepayments Terminal API
    description: >-
      A REST/JSON API hosted on Azure API Management for pairing and driving
      takepayments card machines (Move5000, PAX A920 Pro) from an integrated app
      or POS. Documented operations include Authentication, Start a Transaction,
      Pairing a Terminal, Split Bill & Gratuity, and Pay at Table. Authentication
      is OAuth 2.0 client-credentials issued by Microsoft Azure AD, with the JWT
      passed as an Authorization Bearer header. Sandbox and production base URLs
      are published on the developer portal; no downloadable OpenAPI/Swagger is
      provided.
    humanURL: https://developer.takepayments.com/apis
    baseURL: https://takepayments-integrated-prod-apim.azure-api.net/
    tags:
      - Terminal API
      - In-Person Payments
      - Card Machines
      - Pay at Table
      - REST
