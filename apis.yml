name: takepayments
kind: company
description: >-
  takepayments (a trading name of Payzone UK Limited) is a United Kingdom
  payment gateway and merchant-services provider that lets businesses accept
  card payments online, in person, and over the phone. Its online payment
  gateway offers Hosted (redirect) and Direct (server-to-server) integrations
  for e-commerce checkouts, delivered as SOAP v1.1 XML and HTTPS form-POST
  requests authenticated with a merchant ID and a pre-shared-key signature
  hash, alongside ready-made shopping-cart plugins and backend SDK code packs.
  Its newer Terminal API is a modern REST/JSON surface hosted on Azure API
  Management, secured with OAuth 2.0 client-credentials via Microsoft Azure AD,
  that pairs and drives card machines (Move5000, PAX A920 Pro) for
  Start-Transaction, Pairing, Split Bill & Gratuity, and Pay at Table flows.
  takepayments runs a real public developer portal at developer.takepayments.com
  but does not publish a downloadable OpenAPI/Swagger definition; its API
  reference is documentation-only, and merchant onboarding is sales-led rather
  than open self-serve.
