aid: takepayments
name: takepayments
review:
  question: Does takepayments publish a real public developer portal with a downloadable OpenAPI/Swagger definition?
  answer: false
  date: '2026-07-24'
  reviewer: API Evangelist
findings:
  summary: |
    takepayments (a trading name of Payzone UK Limited) is a United Kingdom
    payment gateway and merchant-services provider. It runs a genuine public
    developer surface across two hosts: a Developer Support hub at
    www.takepayments.com/developer-support/ (HTTP 200) for the online payment
    gateway, and a dedicated developer portal at developer.takepayments.com
    (HTTP 200) for its integrated Terminal API. Neither surface publishes a
    downloadable OpenAPI/Swagger, Postman collection, GraphQL SDL, or .proto;
    the API reference is documentation-only (HTML pages plus PDF integration
    guides and PHP code packs). Zero machine-readable API specs were harvested.

    Two distinct API products exist. (1) The Gateway API for e-commerce card
    acceptance is offered as Hosted (redirect) and Direct (server-to-server /
    transparent redirect) integrations, transported as SOAP v1.1 XML and HTTPS
    form-POST, authenticated with a merchant ID plus a pre-shared-key signature
    hash. Its reference is the PDF integration guide
    (mapi.takepayments.com/media/.../takepayments-gateway-integration-guide_v3-02_07-22.pdf,
    HTTP 200) and downloadable Hosted/Direct code packs (HTTP 200). (2) The
    Terminal API is a modern REST/JSON surface hosted on Azure API Management
    for pairing and driving card machines (Move5000, PAX A920 Pro), with
    documented operations for Authentication, Start a Transaction, Pairing,
    Split Bill & Gratuity, and Pay at Table.

    Auth model differs by product. The Gateway uses merchant ID + pre-shared-key
    hash signature over SOAP/form-POST. The Terminal API uses OAuth 2.0
    client-credentials issued by Microsoft Azure AD; the merchant supplies a
    Client Id, Client Secret, and Scope to fetch a JWT from
    login.microsoftonline.com, then passes it as an Authorization Bearer header.
    Confirmed base URLs: sandbox
    https://takepayments-integrated-sandbox-apim.azure-api.net/ and production
    https://takepayments-integrated-prod-apim.azure-api.net/ (HTTP 401 without a
    token, confirming a live, auth-gated host). No webhook/event catalog or
    AsyncAPI was found. A github.com/takepayments organization exists but has
    zero public repositories. Merchant onboarding is sales-led, not open
    self-serve. Home market is the United Kingdom.
