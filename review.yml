  transports:
  - protocol: SOAP
    scheme: https
    documented: true
    note: Gateway accepts SOAP v1.1 XML messages over HTTPS (Direct integration).
  - protocol: HTTP-FORM-POST
    scheme: https
    documented: true
    note: Gateway Hosted and Direct/Transparent-Redirect flows use HTTPS form-POST.
  - protocol: REST
    scheme: https
    baseURL: https://takepayments-integrated-prod-apim.azure-api.net/
    documented: true
    note: Terminal API is REST/JSON on Azure API Management.
  auth:
  - product: Gateway API
    scheme: merchant-id + pre-shared-key signature hash
    documented: true
  - product: Terminal API
    scheme: OAuth 2.0 client-credentials (Microsoft Azure AD)
    documented: true
    tokenEndpointSandbox: https://login.microsoftonline.com/cf77fc4a-626b-46ff-bd3a-3400a727352f/oauth2/v2.0/token
    tokenEndpointProduction: https://login.microsoftonline.com/0bdad8b5-fe48-4ccd-b807-e6b2662a6d0c/oauth2/v2.0/token
    header: 'Authorization: Bearer {{JWT token}}'
  webhooks:
    documented: false
    note: No webhook/event catalog or AsyncAPI found on either developer surface.
  postman:
    documented: false
  githubOrganization:
    url: https://github.com/takepayments
    exists: true
    publicRepos: 0
  onboarding: sales-led (merchant account required; not open self-serve API signup)
