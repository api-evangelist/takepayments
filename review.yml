actions:
  openapiHarvested: false
  specsSaved: 0
  reason: >-
    No downloadable OpenAPI/Swagger/Postman/GraphQL/gRPC/AsyncAPI artifact is
    published by takepayments on either developer surface as of the review date.
    The Gateway is a SOAP/form-POST rail documented via PDF; the Terminal API is
    a REST surface documented as HTML only. Identity and the two documented API
    products were captured faithfully; nothing was fabricated.
